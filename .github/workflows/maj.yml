name: Mise a jour du graphique
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests matplotlib pandas
      - run: python graphique.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - name: Enregistrer l'image
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add progression_devoirs.png
          git commit -m "maj graphique" || exit 0
          git push
